# https://docs.docker.com/compose/compose-file/

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v{{cookiecutter.mlflow_version}}
    ports:
      - 5000:5000
    volumes:
      - ./mlflow.db:/mlflow/mlflow.db
      - ./mlartifacts:/mlflow/mlartifacts
    working_dir: /mlflow
    # SQLAlchemy backend, same store the package writes to locally: the file store is in
    # maintenance mode in MLflow 3 and was never designed for the model registry.
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --artifacts-destination ./mlartifacts
