# https://docs.astral.sh/uv/reference/settings/
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/

# PROJECT

[project]
name = "{{cookiecutter.repository}}"
version = "{{cookiecutter.version}}"
description = "{{cookiecutter.description}}"
authors = [{ name = "{{cookiecutter.user}}" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
keywords = ["mlops", "python", "package"]
requires-python = ">={{cookiecutter.python_version}}"
dependencies = [
  "loguru>=0.7.3",
  "mlflow>={{cookiecutter.mlflow_version}}",
]

# LINKS

[project.urls]
Homepage = "https://github.com/{{cookiecutter.user}}/{{cookiecutter.repository}}"
Documentation = "https://{{cookiecutter.user}}.github.io/{{cookiecutter.repository}}/"
Repository = "https://github.com/{{cookiecutter.user}}/{{cookiecutter.repository}}"
"Bug Tracker" = "https://github.com/{{cookiecutter.user}}/{{cookiecutter.repository}}/issues"
Changelog = "https://github.com/{{cookiecutter.user}}/{{cookiecutter.repository}}/blob/main/CHANGELOG.md"

# SCRIPTS

[project.scripts]
{{cookiecutter.repository}} = "{{cookiecutter.package}}.scripts:main"

# DEPENDENCIES

[dependency-groups]
dev = [
  "lefthook>=2.1.10",
  "pdoc>=16.0.0",
  "pip-audit>=2.10.1",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-mock>=3.15.1",
  "pytest-xdist>=3.8.0",
  # Ruff 0.16 formats Python inside Markdown and rewrote the default rule set:
  # an older Ruff would disagree with this repository's formatting, so floor it.
  "ruff>=0.16.2",
  "ty>=0.0.69,<0.1", # pre-1.0: pin a compatible range until it stabilizes
  "validate-pyproject>=0.25",
]
notebook = ["ipykernel>=6.29.5", "nbformat>=5.10.4"]

# TOOLS

[tool.ruff]
line-length = 120
# Derived from the single `python_version` answer so `requires-python`, ty, and ruff
# can never drift apart (e.g. "3.14" -> "py314").
target-version = "py{{cookiecutter.python_version.replace('.', '')}}"

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint]
select = [
  "A", # flake8-builtins
  "ARG", # flake8-unused-arguments
  "B", # flake8-bugbear
  "C4", # flake8-comprehensions
  "D", # pydocstyle (documented public API)
  "E", # pycodestyle errors
  "ERA", # eradicate (no commented-out code)
  "F", # pyflakes
  "FA", # flake8-future-annotations
  "FURB", # refurb (modern constructs)
  "I", # isort (import sorting)
  "ISC", # flake8-implicit-str-concat
  "LOG", # flake8-logging
  "N", # pep8-naming
  "PERF", # Perflint
  "PGH", # pygrep-hooks
  "PIE", # flake8-pie
  "PT", # flake8-pytest-style
  "PTH", # flake8-use-pathlib
  "Q", # flake8-quotes
  "RET", # flake8-return
  "RSE", # flake8-raise
  "RUF", # ruff-specific rules
  "S", # flake8-bandit (security; replaces bandit)
  "SIM", # flake8-simplify
  "SLF", # flake8-self
  "T10", # flake8-debugger
  "T20", # flake8-print
  "TID", # flake8-tidy-imports
  "UP", # pyupgrade
  "W", # pycodestyle warnings
]
ignore = [
  "E501", # line length handled by the formatter
  "N812", # project convention: `import typing as T`
  "UP040", # some aliases double as runtime constructors (PEP 695 `type` would break them)
  "RUF012", # Pydantic copies mutable field defaults per-instance (rule false-positive here)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "D100", # missing docstring in public module
  "D103", # missing docstring in public function
  "S101", # asserts allowed in tests
  "T201", # prints allowed in tests
  "PTH", # os.path allowed in test helpers
  "PT003", # explicit scope="function" kept for teaching clarity
  "ARG002", # fixtures requested for their side effects
  "SLF001", # tests may access internals
]
"notebooks/**" = [
  "S101", # asserts allowed in exploratory notebooks
  "T201", # prints allowed in exploratory notebooks
]

[tool.ty.environment]
python-version = "{{cookiecutter.python_version}}"

# `ty` (pre-1.0) does not model Pydantic/pandera/MLflow dynamic typing yet; relax the
# categories they trigger so `ty` still gates real errors (undefined names, bad calls).
[tool.ty.rules]
invalid-argument-type = "ignore" # dynamic ML/MLflow call sites
invalid-frozen-dataclass-subclass = "ignore" # ty reads frozen Pydantic models as frozen dataclasses
invalid-type-form = "ignore" # pandera typed Series / dynamic type forms
not-subscriptable = "ignore" # optional dynamic MLflow attributes
possibly-missing-submodule = "ignore" # lazily-loaded mlflow.* submodules
unresolved-attribute = "ignore" # dynamic attributes on MLflow/pandera objects

[tool.pytest.ini_options]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--cov=src",
  "--cov-report=term-missing",
  # A starting floor for a package that is still mostly scaffolding. The reference
  # implementation runs at 100; raise this as your suite grows, and treat a drop as a
  # regression to fix rather than a threshold to lower.
  "--cov-fail-under=80",
]
pythonpath = ["src"]
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

# SYSTEMS

[build-system]
# Keep the upper bound at least one minor ahead of the pinned `uv` tool: without it
# `uv build` warns, and a future breaking `uv_build` would silently break the sdist.
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"
