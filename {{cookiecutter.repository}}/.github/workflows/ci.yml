# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: {% raw %}${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}{% endraw %}
  cancel-in-progress: {% raw %}${{ github.ref != 'refs/heads/main' }}{% endraw %}
jobs:
  checks: # name kept as "checks": .github/rulesets/main.json requires that status check context
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no step pushes back to the repository
      - name: Install mise toolchain
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: true
      - name: Run canonical gate
        run: mise run all
      - name: Verify no changes
        run: test -z "$(git status --porcelain)" || { git status --porcelain; git diff; exit 1; }
